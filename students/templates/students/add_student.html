<!DOCTYPE html>
<html>
    <head>
        <title>Add Student</title>
    </head>
    <body>

        <h1>Add Student</h1>

        <form method="POST">

            {% csrf_token %}

            <p>
                Name:
                <input type="text" name="name">
            </p>

            <p>
                Age:
                <input type="number" name="age">
            </p>

            <p>
                Email:
                <input type="email" name="email">
            </p>

            <p>
                Course:
                <input type="text" name="course">
            </p>

            <button type="submit">
                Save Student
            </button>

        </form>

    </body>
</html>
