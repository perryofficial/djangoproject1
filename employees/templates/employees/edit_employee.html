<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
</head>
<body>

<h1>Edit Employee</h1>

<form method="POST">

    {% csrf_token %}

    <p>
        Name:
        <input type="text" name="name" value="{{ employee.name }}" required>
    </p>

    <p>
        Age:
        <input type="number" name="age" value="{{ employee.age }}" required>
    </p>

    <p>
        Department:
        <input type="text" name="department" value="{{ employee.department }}" required>
    </p>

    <p>
        Salary:
        <input type="number" step="0.01" name="salary" value="{{ employee.salary }}" required>
    </p>

    <p>
        Email:
        <input type="email" name="email" value="{{ employee.email }}" required>
    </p>

    <p>
        Joining Date:
        <input type="date" name="joining_date" value="{{ employee.joining_date|date:'Y-m-d' }}" required>
    </p>

    <button type="submit">
        Update Employee
    </button>

</form>

<br>

<a href="{% url 'employee_list' %}">Back to Employee List</a>

</body>
</html>
