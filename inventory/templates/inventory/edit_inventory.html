<!DOCTYPE html>
<html>
<head>
    <title>Edit Inventory</title>
</head>
<body>

    <h1>Edit Inventory</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
            <label>Item Name:</label><br>
            <input type="text" name="item_name" value="{{ inventory.item_name }}" required>
        </p>

        <p>
            <label>Quantity:</label><br>
            <input type="number" name="quantity" value="{{ inventory.quantity }}" required>
        </p>

        <p>
            <label>Price:</label><br>
            <input type="number" step="0.01" name="price" value="{{ inventory.price }}" required>
        </p>

        <p>
            <label>Purchase Date:</label><br>
            <input type="date" name="purchase_date" value="{{ inventory.purchase_date|date:'Y-m-d' }}" required>
        </p>

        <p>
            <label>In Stock:</label><br>

            <select name="in_stock">
                <option value="True" {% if inventory.in_stock %}selected{% endif %}>Yes</option>
                <option value="False" {% if not inventory.in_stock %}selected{% endif %}>No</option>
            </select>
        </p>

        <button type="submit">Update Inventory</button>
    </form>

    <br>

    <a href="{% url 'inventory_list' %}">Back to Inventory List</a>

</body>
</html>
