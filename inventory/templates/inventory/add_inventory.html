<!DOCTYPE html>
<html>
<head>
    <title>Add Inventory</title>
</head>
<body>

    <h1>Add Inventory</h1>

    <form method="POST">

        {% csrf_token %}

        <p>
            Item Name:
            <input
                type="text"
                name="item_name"
                value="{{ inventory.item_name }}"
                required
            >
        </p>

        <p>
            Quantity:
            <input
                type="number"
                name="quantity"
                value="{{ inventory.quantity }}"
                required
            >
        </p>

        <p>
            Price:
            <input
                type="number"
                step="0.01"
                name="price"
                value="{{ inventory.price }}"
                required
            >
        </p>

        <p>
            Purchase Date:
            <input
                type="date"
                name="purchase_date"
                value="{{ inventory.purchase_date|date:'Y-m-d' }}"
                required
            >
        </p>

        <p>
            In Stock:
            <select name="in_stock">
                <option value="True" {% if inventory.in_stock %}selected{% endif %}>Yes</option>
                <option value="False" {% if not inventory.in_stock %}selected{% endif %}>No</option>
            </select>
        </p>

        <button type="submit">
            Add Inventory
        </button>

    </form>

    <br>

    <a href="{% url 'inventory_list' %}">Back to Inventory List</a>

</body>
</html>
