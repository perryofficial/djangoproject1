<!DOCTYPE html> 
<html>
    <head>
        <title>Edit Clothes</title>
    </head>
    <body>

        <h1>Edit Clothes</h1>

        <form method="POST">
            {% csrf_token %}

            <p>
                Item Name:
                <input type="text" name="item_name" value="{{ clothes.item_name }}">
            </p>

            <p>
                Brand:
                <input type="text" name="brand" value="{{ clothes.brand }}">
            </p>

            <p>
                Size:
                <input type="text" name="size" value="{{ clothes.size }}">
            </p>

            <p>
                Color:
                <input type="text" name="color" value="{{ clothes.color }}">
            </p>

            <p>
                Price:
                <input type="number" step="0.01" name="price" value="{{ clothes.price }}">
            </p>

            <p>
                In Stock:
                <input type="checkbox" name="in_stock" {% if clothes.in_stock %}checked{% endif %}>
            </p>

            <button type="submit">Update Clothes</button>
        </form>
        <br>
        <a href="{% url 'clothes_list' %}">Back to Clothes List</a>

    </body>
