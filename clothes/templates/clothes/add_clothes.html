<!DOCTYPE html>
<html>
    <head>
        <title>Add Clothes</title>
    </head>
    <body>

        <h1>Add clothes</h1>

        <form method="POST">
            {% csrf_token %}

            <p>
                Item Name:
                <input type="text" name="item_name">
            </p>

            <p>
                Brand:
                <input type="text" name="brand">
            </p>

            <p>
                Size:
                <input type="text" name="size">
            </p>

            <p>
                Color:
                <input type="text" name="color">
            </p>

            <p>
                Price:
                <input type="number" step="0.01" name="price">
            </p>

            <p>
                In Stock:
                <select name="in_stock">
                    <option value="True" {% if clothes.in_stock %}selected{% endif %}>Yes</option>
                    <option value="False" {% if not clothes.in_stock %}selected{% endif %}>No</option>
                </select>
            </p>

            <button type="submit">Save Clothes</button>
        </form>
        <br>
        <a href="{% url 'clothes_list' %}">Back to Clothes List</a>
    </body>
</html>
